<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LamiGo Auth Portal (Light Mode)</title>
    <style>
        :root {
            --primary: #4facfe;
            --secondary: #00f2fe;
            --bg: #f0f2f5;
            --glass: rgba(255, 255, 255, 0.85);
            --text-main: #2d3436;
            --text-sub: #636e72;
            --success: #00b894;
            --error: #d63031;
        }

        body {
            margin: 0;
            font-family: 'Inter', -apple-system, sans-serif;
            background: linear-gradient(120deg, #a1c4fd 0%, #c2e9fb 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-main);
        }

        .glass-card {
            width: 440px;
            padding: 2.5rem;
            background: var(--glass);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.05);
            text-align: center;
        }

        h2 { margin: 0; font-weight: 800; color: #1e3799; letter-spacing: -0.5px; }
        .subtitle { font-size: 0.85rem; color: var(--text-sub); margin-bottom: 1.5rem; }

        .tabs { 
            display: flex; 
            background: rgba(0,0,0,0.05); 
            border-radius: 12px; 
            margin-bottom: 1.5rem; 
            padding: 4px; 
        }
        .tab { 
            flex: 1; 
            padding: 10px; 
            cursor: pointer; 
            border-radius: 10px; 
            font-size: 0.8rem; 
            transition: 0.2s; 
            font-weight: 600;
            color: var(--text-sub);
        }
        .tab.active { 
            background: white; 
            color: var(--primary); 
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .input-group { text-align: left; margin-bottom: 1rem; }
        label { font-size: 0.7rem; font-weight: 700; color: #4b6584; margin-bottom: 6px; display: block; }
        
        input {
            width: 100%;
            padding: 12px 16px;
            background: white;
            border: 1px solid rgba(0,0,0,0.1);
            border-radius: 10px;
            color: var(--text-main);
            outline: none;
            box-sizing: border-box;
            transition: 0.2s;
        }
        input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79, 172, 254, 0.1); }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn:hover { opacity: 0.9; transform: translateY(-1px); }

        #tokenContainer { margin-top: 1.5rem; }
        textarea {
            width: 100%;
            height: 120px;
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-family: 'Monaco', monospace;
            font-size: 0.7rem;
            padding: 10px;
            box-sizing: border-box;
            resize: none;
            margin-top: 8px;
        }

        .status-msg { font-size: 0.8rem; margin: 12px 0; font-weight: 600; min-height: 1.2rem; }
        .hidden { display: none; }
        #recaptcha-container { display: flex; justify-content: center; }
    </style>
</head>
<body>

<div class="glass-card">
    <h2>LamiGo Portal</h2>
    <p class="subtitle">Management & Driver Auth Gateway</p>

    <div class="tabs">
        <div id="tab-email" class="tab active" onclick="switchTab('email')">SuperAdmin</div>
        <div id="tab-phone" class="tab" onclick="switchTab('phone')">Staff Registration</div>
    </div>

    <div id="email-section">
        <div class="input-group">
            <label>Admin Email</label>
            <input type="email" id="email" value="lamigo.sdgp@gmail.com">
        </div>
        <button class="btn" onclick="handleEmailLogin()">Get Admin Token</button>
    </div>

    <div id="phone-section" class="hidden">
        <div class="input-group">
            <label>Register/Login Mobile</label>
            <input type="text" id="phone" placeholder="+947XXXXXXXX">
        </div>
        <div id="recaptcha-container"></div>
        <button class="btn" id="otp-btn" onclick="handlePhoneAuth()">Send Verification Code</button>

        <div id="otp-entry" class="hidden" style="margin-top: 1rem;">
            <div class="input-group">
                <label>Verification Code (e.g. 000000)</label>
                <input type="text" id="otp" placeholder="Enter code">
            </div>
            <button class="btn" onclick="verifyOTP()">Verify Identity</button>
        </div>
    </div>

    <div id="status" class="status-msg"></div>

    <div id="tokenContainer">
        <label>Identity Data (Copy to Seed Script)</label>
        <textarea id="tokenBox" readonly></textarea>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js";
    import { 
        getAuth, signInWithEmailAndPassword, signInWithPhoneNumber, RecaptchaVerifier 
    } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBtM080L9atsQTH_rb__dNoRnnbw1ehd1Q",
        authDomain: "lamigo-core.firebaseapp.com",
        projectId: "lamigo-core",
        storageBucket: "lamigo-core.firebasestorage.app",
        messagingSenderId: "461121459169",
        appId: "1:461121459169:web:8f80b06661678bcb7238a0"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    window.switchTab = (type) => {
        document.getElementById('email-section').classList.toggle('hidden', type !== 'email');
        document.getElementById('phone-section').classList.toggle('hidden', type !== 'phone');
        document.getElementById('tab-email').classList.toggle('active', type === 'email');
        document.getElementById('tab-phone').classList.toggle('active', type === 'phone');
        document.getElementById('status').innerText = "";
    };

    const setStatus = (msg, color = 'var(--primary)') => {
        const s = document.getElementById('status');
        s.innerText = msg;
        s.style.color = color;
    };

    // --- EMAIL ---
    window.handleEmailLogin = async () => {
        const email = document.getElementById('email').value;
        const pass = prompt("Admin Password:");
        if(!pass) return;
        try {
            const res = await signInWithEmailAndPassword(auth, email, pass);
            const token = await res.user.getIdToken();
            document.getElementById('tokenBox').value = `ADMIN UID: ${res.user.uid}\n\nTOKEN: ${token}`;
            setStatus("✅ Success!", "var(--success)");
        } catch (e) { setStatus(e.message, "var(--error)"); }
    };

    // --- PHONE ---
    window.handlePhoneAuth = async () => {
        const num = document.getElementById('phone').value;
        if(!num) return;

        // Reset verifier if it exists
        if(window.recaptchaWidgetId != null) {
            window.verifier.clear();
            window.recaptchaWidgetId = null;
        }

        // Initialize Verifier
        window.verifier = new RecaptchaVerifier(auth, 'recaptcha-container', { 
            'size': 'invisible',
            'callback': (response) => { console.log("reCAPTCHA solved"); }
        });

        setStatus("📡 Requesting Code...");
        try {
            window.confirmation = await signInWithPhoneNumber(auth, num, window.verifier);
            document.getElementById('otp-entry').classList.remove('hidden');
            setStatus("📩 Code sent. Use 000000 for test numbers.", "var(--primary)");
        } catch (e) { 
            console.error("Full Error:", e);
            setStatus("❌ " + e.code, "var(--error)"); 
        }
    };

    window.verifyOTP = async () => {
        const code = document.getElementById('otp').value;
        try {
            const res = await window.confirmation.confirm(code);
            const token = await res.user.getIdToken();
            document.getElementById('tokenBox').value = `UID: ${res.user.uid}\n\nTOKEN: ${token}`;
            setStatus("🎉 Registered Successfully!", "var(--success)");
        } catch (e) { setStatus("Invalid Code", "var(--error)"); }
    };
</script>
</body>
</html>
