services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lamigo-api
    restart: always
    ports:
      - "8000:8000"
    environment:
      # Now Docker Compose will find these variables from .env in the root
      - DATABASE_URL=postgresql+psycopg://${DB_USER}:${DB_PASSWORD}@host.docker.internal:${DB_PORT}/${DB_NAME}
    volumes:
      - ./backend:/app
      - /app/env
      - /app/.venv