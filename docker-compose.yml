services:
  db:
    image: postgres:15
    container_name: lamigo-db
    restart: always
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lamigo-backend
    restart: always
    depends_on:
      - db
    ports:
      - "8000:8000"
      
    # --- Environment Variables Injection ---
    env_file:
      - .env  
      
    environment:
      # --- Docker Network Override ---
      - DATABASE_URL=postgresql+psycopg://${DB_USER}:${DB_PASSWORD}@db:${DB_PORT}/${DB_NAME}
      
      # --- Docker Path Override ---
      # Inside the container, the 'backend' folder IS the root directory (/app).
      # We override the .env path so Docker looks in the right place.
      - FIREBASE_CREDENTIALS_PATH=credentials/firebase-adminsdk.json
      
    volumes:
      # --- Live Reload Mount ---
      - ./backend:/app
      - /app/env
      - /app/.venv

volumes:
  postgres_data: