# docker-compose.yml
version: '3.8'

services:
  # Service 1: The Backend API
  backend:
    build: ./backend
    container_name: lamigo_backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app  # Live Sync: Changes in VS Code update the container instantly
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    depends_on:
      - db
    # This ensures the container can find the firebase key
    environment:
      - FIREBASE_SERVICE_ACCOUNT_PATH=config/serviceAccountKey.json

  # Service 2: The PostgreSQL Database
  db:
    image: postgres:15
    container_name: lamigo_db
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=lamigo_db
    ports:
      - "5432:5432"

volumes:
  postgres_data: