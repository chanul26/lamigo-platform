name: LamiGo Backend CI/CD

on:
  push:
    branches: [ "main", "dev", "chore/setup-gcp-cd" ]  
  pull_request:
    branches: [ "main", "dev" ]

env:
  PROJECT_ID: lamigo-backend-production
  REGION: asia-south1
  REPO_NAME: lamigo-repo
  IMAGE_NAME: backend-image

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    # --- THE MAGIC FIX IS HERE ---
    - name: Inject Firebase Credentials
      run: |
        mkdir -p backend/credentials
        echo '${{ secrets.FIREBASE_CREDENTIALS_JSON }}' > backend/credentials/firebase-adminsdk.json
        
        # 1. Force Docker to stop ignoring the file
        touch backend/.dockerignore
        echo "!credentials/firebase-adminsdk.json" >> backend/.dockerignore
        
        # 2. Force the Dockerfile to explicitly copy this exact file
        echo "COPY credentials/firebase-adminsdk.json credentials/firebase-adminsdk.json" >> backend/Dockerfile

    - name: Authenticate to Google Cloud
      id: auth
      uses: google-github-actions/auth@v2
      with:
        token_format: 'access_token'
        workload_identity_provider: '${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}'
        service_account: '${{ secrets.GCP_SERVICE_ACCOUNT }}'

    - name: Login to Artifact Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGION }}-docker.pkg.dev
        username: oauth2accesstoken
        password: ${{ steps.auth.outputs.access_token }}

    - name: Build and Push Docker Image
      run: |
        IMAGE_PATH="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
        docker build -t $IMAGE_PATH ./backend
        docker push $IMAGE_PATH

    - name: Deploy to Cloud Run
      uses: google-github-actions/deploy-cloudrun@v2
      with:
        service: lamigo-backend
        region: ${{ env.REGION }}
        image: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
        flags: '--port=8000'
        
        env_vars: |
          FIREBASE_CREDENTIALS_PATH=credentials/firebase-adminsdk.json
          BACKEND_CORS_ORIGINS=["*"]
          SECRET_KEY=${{ secrets.PROD_SECRET_KEY }}
          DATABASE_URL=${{ secrets.PROD_DATABASE_URL }}
          AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION=${{ secrets.AWS_REGION }}
          NOTIFY_USER_ID=${{ secrets.NOTIFY_USER_ID }}
          NOTIFY_API_KEY=${{ secrets.NOTIFY_API_KEY }}
          NOTIFY_SENDER_ID=${{ secrets.NOTIFY_SENDER_ID }}