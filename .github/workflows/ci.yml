name: LamiGo Backend CI

# 1. Trigger: When do we run?
on:
  push:
    branches: [ "main", "dev", "feature/*" ]  # Run on pushes to main, dev, or features
  pull_request:
    branches: [ "main", "dev" ]               # Run on PRs targeting main/dev

jobs:
  # 2. The Job: "Build and Test"
  build-and-test:
    runs-on: ubuntu-latest  # Use a Linux server provided by GitHub

    steps:
    # A. Check out the code
    - name: Checkout Code
      uses: actions/checkout@v4

    # B. Set up Docker (GitHub Actions comes with it, but this setup ensures compatibility)
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # C. Create a dummy .env file in the ROOT (required by docker-compose)
    - name: Create Dummy Env File
      run: |
        echo "DB_USER=postgres" >> .env
        echo "DB_PASSWORD=password" >> .env
        echo "DB_PORT=5432" >> .env
        echo "DB_NAME=lamigo_db" >> .env
        echo "SECRET_KEY=ci-test-key-123" >> .env
        echo "DATABASE_URL=postgresql+psycopg://postgres:password@db:5432/lamigo_db" >> .env

    # D. Build the Docker Image
    - name: Build Docker Image
      run: |
        docker compose build backend

    # E. Verify Backend Starts
    - name: Verify Backend Starts
      run: |
        docker compose up -d backend
        # Give it a second to initialize
        sleep 5
        docker compose exec -T backend python --version